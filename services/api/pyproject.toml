[project]
name = "study-api"
version = "0.1.0"
description = "家庭 AI 学习助手的 FastAPI 模块化单体起始骨架"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.5",
  "boto3==1.43.46",
  "fastapi==0.136.3",
  "paddleocr[doc-parser]==3.7.0; sys_platform != 'linux' or platform_machine == 'x86_64'",
  "paddlepaddle==3.3.1; sys_platform != 'linux' or platform_machine == 'x86_64'",
  "pillow==12.3.0",
  "psycopg[binary]==3.3.4",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.41.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.1",
  "pytest-asyncio==1.3.0",
  "mypy==1.18.2",
  "ruff==0.14.5",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: requires the local synthetic PostgreSQL service",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
