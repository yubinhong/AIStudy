name: study-local

services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/compose/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/compose/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/compose/.env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - default
      - parser-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.5-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/compose/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/compose/.env}
    volumes:
      - minio-data:/data
    networks:
      - default
      - parser-backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  local-model:
    # The container stays idle when local inference is disabled. This keeps a
    # single Compose file usable for both cloud and local routing without
    # requiring a second deployment topology.
    image: ${STUDY_LOCAL_MODEL_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b9603}
    environment:
      LLAMA_CACHE: /models-cache
      STUDY_LOCAL_MODEL_ENABLED: ${STUDY_LOCAL_MODEL_ENABLED:-false}
      STUDY_LOCAL_MODEL_HF_REPO: ${STUDY_LOCAL_MODEL_HF_REPO:-bjivanovich/Qwen3.5-4B-Vision-GGUF}
      STUDY_LOCAL_MODEL_MODEL_FILE: ${STUDY_LOCAL_MODEL_MODEL_FILE:-Qwen3.5-4B.Q4_K_M.gguf}
      STUDY_LOCAL_MODEL_MMPROJ_FILE: ${STUDY_LOCAL_MODEL_MMPROJ_FILE:-Qwen3.5-4B.BF16-mmproj.gguf}
      STUDY_LOCAL_MODEL_ALIAS: ${STUDY_LOCAL_MODEL_NAME:-Qwen3.5-4B-Q4_K_M}
      STUDY_LOCAL_MODEL_CONTEXT_SIZE: ${STUDY_LOCAL_MODEL_CONTEXT_SIZE:-8192}
      STUDY_LOCAL_MODEL_PARALLEL: ${STUDY_LOCAL_MODEL_PARALLEL:-1}
      HTTP_PROXY: ${STUDY_LOCAL_MODEL_PROXY_URL:-}
      HTTPS_PROXY: ${STUDY_LOCAL_MODEL_PROXY_URL:-}
      ALL_PROXY: ${STUDY_LOCAL_MODEL_PROXY_URL:-}
      NO_PROXY: 127.0.0.1,localhost,local-model
      http_proxy: ${STUDY_LOCAL_MODEL_PROXY_URL:-}
      https_proxy: ${STUDY_LOCAL_MODEL_PROXY_URL:-}
      all_proxy: ${STUDY_LOCAL_MODEL_PROXY_URL:-}
      no_proxy: 127.0.0.1,localhost,local-model
    command:
      - |
        if [ "$${STUDY_LOCAL_MODEL_ENABLED}" != "true" ]; then
          echo "local model disabled; keeping llama.cpp idle"
          exec sleep infinity
        fi
        download_model_file() {
          file_name="$$1"
          target="/models-cache/$$file_name"
          if [ -s "$$target" ]; then
            return
          fi
          echo "downloading local model asset: $$file_name"
          curl --fail --location --retry 5 --retry-all-errors --continue-at - \
            --output "$$target.part" \
            "https://huggingface.co/$${STUDY_LOCAL_MODEL_HF_REPO}/resolve/main/$$file_name?download=true"
          mv "$$target.part" "$$target"
        }
        download_model_file "$${STUDY_LOCAL_MODEL_MODEL_FILE}"
        download_model_file "$${STUDY_LOCAL_MODEL_MMPROJ_FILE}"
        exec /app/llama-server \
          --model "/models-cache/$${STUDY_LOCAL_MODEL_MODEL_FILE}" \
          --mmproj "/models-cache/$${STUDY_LOCAL_MODEL_MMPROJ_FILE}" \
          --alias "$${STUDY_LOCAL_MODEL_ALIAS}" \
          --ctx-size "$${STUDY_LOCAL_MODEL_CONTEXT_SIZE}" \
          --parallel "$${STUDY_LOCAL_MODEL_PARALLEL}" \
          --jinja \
          --host 0.0.0.0 \
          --port 8080
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - local-model-cache:/models-cache
    networks:
      - default
    healthcheck:
      test:
        ["CMD-SHELL", "if [ \"$${STUDY_LOCAL_MODEL_ENABLED}\" != \"true\" ]; then exit 0; fi; curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15m
    restart: unless-stopped

  migrate:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in infra/compose/.env}
      PYTHONPATH: /app/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - parser-backend
    restart: "no"

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      STUDY_API_PROFILE_REPOSITORY: postgres
      STUDY_API_LEARNING_REPOSITORY: postgres
      STUDY_API_CURRICULUM_REPOSITORY: postgres
      STUDY_API_OCR_QUEUE: postgres
      STUDY_API_OCR_RESULTS: postgres
      STUDY_API_IMAGE_ANALYSIS_REPOSITORY: postgres
      STUDY_API_AUTH_REPOSITORY: postgres
      STUDY_COOKIE_SECURE: ${STUDY_COOKIE_SECURE:-false}
      STUDY_ENGLISH_LIVE_ENABLED: ${STUDY_ENGLISH_LIVE_ENABLED:-false}
      STUDY_ENGLISH_LIVE_PROVIDER: ${STUDY_ENGLISH_LIVE_PROVIDER:-disabled}
      STUDY_ENGLISH_LIVE_CONSENT_VERSION: ${STUDY_ENGLISH_LIVE_CONSENT_VERSION:-english-audio-consent.v1}
      STUDY_LOCAL_MODEL_ENABLED: ${STUDY_LOCAL_MODEL_ENABLED:-false}
      STUDY_CAPTURE_UPLOAD_CONCURRENCY: ${STUDY_CAPTURE_UPLOAD_CONCURRENCY:-4}
      STUDY_CAPTURE_UPLOAD_TIMEOUT_SECONDS: ${STUDY_CAPTURE_UPLOAD_TIMEOUT_SECONDS:-120}
      PADDLE_MODEL_ROOT: /opt/study/models
    ports:
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      local-model:
        condition: service_healthy
    networks:
      - default
      - parser-backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    environment:
      STUDY_API_URL: http://api:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  image-analysis-worker:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    command: ["python", "scripts/run_image_analysis_worker.py", "--watch"]
    env_file:
      - .env
    environment:
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      IMAGE_ANALYSIS_WORKER_POLL_INTERVAL_SECONDS: ${IMAGE_ANALYSIS_WORKER_POLL_INTERVAL_SECONDS:-2}
      PADDLE_MODEL_ROOT: /opt/study/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      local-model:
        condition: service_healthy
    restart: unless-stopped

  material-parse-worker:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    command: ["python", "scripts/run_material_parse_worker.py", "--watch"]
    env_file:
      - .env
    environment:
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      MATERIAL_PARSE_POLL_INTERVAL_SECONDS: ${MATERIAL_PARSE_POLL_INTERVAL_SECONDS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    networks:
      - parser-backend
    restart: unless-stopped

  curriculum-analysis-worker:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    command: ["python", "scripts/run_curriculum_analysis_worker.py", "--watch"]
    env_file:
      - .env
    environment:
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      CURRICULUM_ANALYSIS_POLL_INTERVAL_SECONDS: ${CURRICULUM_ANALYSIS_POLL_INTERVAL_SECONDS:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      local-model:
        condition: service_healthy
    networks:
      - default
      - parser-backend
    restart: unless-stopped

  data-lifecycle-worker:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    command: ["python", "scripts/run_data_lifecycle_worker.py", "--watch"]
    env_file:
      - .env
    environment:
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      DATA_LIFECYCLE_POLL_INTERVAL_SECONDS: ${DATA_LIFECYCLE_POLL_INTERVAL_SECONDS:-300}
      LEARNING_HISTORY_CLEANUP_ENABLED: ${LEARNING_HISTORY_CLEANUP_ENABLED:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  local-model-cache:

networks:
  parser-backend:
    internal: true
