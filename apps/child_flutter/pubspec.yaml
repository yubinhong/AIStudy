name: study_child
description: 孩子端学习体验的 Flutter P0 骨架。
publish_to: "none"
version: 0.16.0+2

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  crypto: 3.0.7
  flutter:
    sdk: flutter
  image_picker: 1.2.3
  record: 7.1.1
  flutter_soloud: 4.0.13
  flutter_secure_storage: 9.2.4
  sqflite: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/ui/child_avatar.png
    - assets/ui/fraction_addition.png
    - assets/ui/synthetic_math_photo.png
