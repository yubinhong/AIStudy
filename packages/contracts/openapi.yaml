openapi: 3.1.0
info:
  title: 家庭 AI 学习助手 API
  version: 0.8.0
  description: Self-hosted Household account/session and learning contract vertical slices.
servers:
  - url: http://localhost:8000
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Service health check
      responses:
        '200':
          description: Service is ready to receive requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/login:
    post:
      operationId: login
      summary: Create a revocable account session
      description: The Web client receives an HttpOnly study_session cookie. Flutter requests client=flutter and stores the returned opaque token in platform secure storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      operationId: getCurrentAccount
      summary: Read the current account
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Current account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/change-password:
    post:
      operationId: changePassword
      summary: Change the current password and rotate all sessions
      security:
        - SessionCookie: []
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed and a new session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/households/{household_id}/accounts:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listAccounts
      summary: List accounts in one household
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Accounts without password hashes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/households/{household_id}/accounts/children:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    post:
      operationId: createChildAccount
      summary: Create a child account bound to one ChildProfile
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildAccountRequest'
      responses:
        '201':
          description: Child account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /auth/households/{household_id}/accounts/{account_id}/status:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: setAccountStatus
      summary: Enable or disable a child account
      security:
        - SessionCookie: []
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAccountStatusRequest'
      responses:
        '200':
          description: Updated child account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/households/{household_id}/accounts/{account_id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resetAccountPassword
      summary: Reset a child account password and revoke its sessions
      security:
        - SessionCookie: []
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset; no password is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /households/{household_id}/children:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listChildren
      summary: List children in the caller's household
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Children visible to the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChildProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createChild
      summary: Create a child profile in the caller's household
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildRequest'
      responses:
        '201':
          description: Child profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
        '200':
          description: Idempotent replay of an earlier create request.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/children/management:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listChildManagement
      summary: List child profiles with their bound child accounts
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Child management aggregates visible to a parent.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChildManagementView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createChildManagement
      summary: Atomically create a child profile and its unique child account
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildManagementRequest'
      responses:
        '201':
          description: Child profile and account created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildManagementView'
        '200':
          description: Idempotent replay of an earlier aggregate create request.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildManagementView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /households/{household_id}/children/{child_id}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: child_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getChild
      summary: Get a child profile in the caller's household
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Child profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateChild
      summary: Update a child profile in the caller's household
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChildRequest'
      responses:
        '200':
          description: Updated child profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
    delete:
      operationId: deleteChild
      summary: Delete a child profile after cascading Capture object deletion
      description: Local/CI synthetic deletion only. The profile is not removed when any Capture object deletion fails; the same idempotency key may be retried.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Child profile and all claimed Capture objects were deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          description: Deletion is incomplete or temporarily unavailable; retry is safe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /households/{household_id}/devices:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listDevices
      summary: List devices in the caller's household
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Devices visible to the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: registerDevice
      summary: Register a device in the caller's household
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
      responses:
        '201':
          description: Device registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '200':
          description: Idempotent replay of an earlier registration.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/tasks:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listTasks
      summary: List tasks visible to the caller
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - name: child_id
          in: query
          required: false
          description: Optional parent-side child scope for the workbench.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tasks visible to the parent or bound child.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudyTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createTask
      summary: Create a math task for a child in the caller's household
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyTask'
        '200':
          description: Idempotent task-create replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/tasks/{task_id}/sessions:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/TaskId'
    post:
      operationId: startStudySession
      summary: Start a session for a task assigned to the bound child
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartStudySessionRequest'
      responses:
        '201':
          description: Study session started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '200':
          description: Idempotent start-session replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/tasks/{task_id}/active-session:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/TaskId'
    get:
      operationId: getActiveStudySession
      summary: Resume the bound child's latest active session for a task
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Latest active child-owned session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /households/{household_id}/capture-sessions:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    post:
      operationId: createCaptureSession
      summary: Create or replay an ad-hoc photo-question session for the bound child
      description: Atomically creates a private math task and active StudySession for photo capture. The child ID is always taken from the authenticated account and cannot be supplied by the client.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Capture session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '200':
          description: Idempotent replay of an existing capture session.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/sessions/{session_id}/attempts:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: recordAttempt
      summary: Append an attempt to the bound child's active study session
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordAttemptRequest'
      responses:
        '201':
          description: Attempt appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '200':
          description: Idempotent attempt replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/sessions/{session_id}/completion:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: completeStudySession
      summary: Finalize the bound child's study session with an explicit outcome
      description: Completion is idempotent and final. A learned or needs_review outcome completes the task; skipped marks it skipped. The server never infers mastery from model output.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteStudySessionRequest'
      responses:
        '200':
          description: Final or idempotently replayed StudySession.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/sync-batches:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    post:
      operationId: syncOfflineBatch
      summary: Apply a versioned batch of offline attempt events atomically
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatchRequest'
      responses:
        '200':
          description: Batch applied or replayed without partial writes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBatchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/sessions/{session_id}/captures:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: listCaptures
      summary: List Capture metadata visible to the bound child in a study session
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Capture metadata. This endpoint never returns media bytes or object URLs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Capture'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createCapture
      summary: Register bounded image metadata and require manual correction
      description: No image bytes, signed URLs, object keys, or OCR Provider calls are accepted in this contract version.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaptureRequest'
      responses:
        '201':
          description: Capture metadata registered with needs_correction status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capture'
        '200':
          description: Idempotent Capture-create replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capture'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/captures/{capture_id}/corrections:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: correctCapture
      summary: Append a manual correction for a Capture owned by the bound child
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectCaptureRequest'
      responses:
        '201':
          description: Manual correction appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureCorrection'
        '200':
          description: Idempotent correction replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureCorrection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Capture version or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /households/{household_id}/captures/{capture_id}/save:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: saveCapture
      summary: Save a Capture image beyond its default retention window
      description: Parent-only local/CI operation. Saving does not expose media bytes, object keys, or storage credentials.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Capture image is marked parent-saved.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/captures/{capture_id}/media:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteCaptureMedia
      summary: Immediately delete one Capture image
      description: Parent-only local/CI operation. Deletion is private-object scoped, retryable, and does not delete Capture metadata.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Capture image deletion completed or was replayed.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '503':
          description: Object storage deletion is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /households/{household_id}/sessions/{session_id}/captures/upload:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: uploadCapture
      summary: Upload one Capture through the authenticated API
      description: The API authorizes the Session before consuming a bounded image stream, validates the declared size/hash and decoded image, then stores the object in private MinIO. Clients never receive an object-storage URL.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: X-Capture-Media-Type
          in: header
          required: true
          schema:
            type: string
            enum: [image/jpeg, image/png]
        - name: X-Capture-Byte-Size
          in: header
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 8000000
        - name: X-Capture-Content-SHA256
          in: header
          required: true
          schema:
            type: string
            minLength: 64
            maxLength: 64
            pattern: '^[a-f0-9]{64}$'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Capture bytes were stored and the Capture advanced to needs_correction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capture'
        '200':
          description: Idempotent upload replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capture'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          description: The bounded image stream failed media, size, hash, or decoded-image validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /households/{household_id}/captures/{capture_id}/ocr-jobs:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: enqueueOcrJob
      summary: Enqueue local OCR for a server-confirmed Capture
      description: The endpoint only records a bounded job request. OCR runs in a separate local Worker and returns manually confirmable candidates; it never accepts image bytes, object keys, or external Provider selection.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnqueueOcrJobRequest'
      responses:
        '202':
          description: OCR job accepted by the local/CI queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrJobReceipt'
        '200':
          description: Idempotent OCR job enqueue replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrJobReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Capture is not ready for OCR or the idempotency key conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /households/{household_id}/captures/{capture_id}/ocr-jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOcrJob
      summary: Read bounded local OCR job status
      description: The response contains stable lifecycle fields only; Provider errors, image bytes, object keys, and OCR text are not returned by this endpoint.
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: OCR job status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrJobReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /households/{household_id}/captures/{capture_id}/image-analysis-jobs:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: startImageAnalysis
      summary: Record a user-confirmed sanitization receipt for one Capture
      description: The service queues a job only when NewAPI is explicitly enabled and the user-confirmed sanitization hash matches the Capture; otherwise it records a blocked job. Only the confirmed derivative may reach the self-hosted Provider.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartImageAnalysisRequest'
      responses:
        '202':
          description: Receipt accepted; status is queued when the self-hosted Provider is enabled, otherwise blocked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageAnalysisJobReceipt'
        '200':
          description: Idempotent replay of the same receipt.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageAnalysisJobReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Capture version, upload state, or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /households/{household_id}/captures/{capture_id}/image-analysis-jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getImageAnalysisJob
      summary: Read provider-neutral ImageAnalysis job state
      description: The response contains only lifecycle, receipt hash, and stable error fields; no image, URL, object key, OCR text, or Provider response is returned.
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: ImageAnalysis job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageAnalysisJobReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /households/{household_id}/captures/{capture_id}/image-analysis-jobs/{job_id}/extraction:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getQuestionExtraction
      summary: Read an unverified question extraction for manual review
      description: Returns only schema-validated extraction fields. The result is not a verified question and must not be used as a Tutor fact before human confirmation.
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Unverified question extraction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionExtractionRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Extraction has not completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /households/{household_id}/captures/{capture_id}/image-analysis-jobs/{job_id}/extraction/verify:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: verifyQuestionExtraction
      summary: Confirm and edit one extraction into a VerifiedQuestion
      description: The unverified extraction remains immutable. Only explicitly submitted fields become a Tutor-safe fact after Household and Capture version checks.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyQuestionRequest'
      responses:
        '201':
          description: Human-confirmed question fact created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedQuestion'
        '200':
          description: Idempotent replay of the same confirmation.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedQuestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Capture version, extraction readiness, or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /households/{household_id}/captures/{capture_id}/image-analysis-jobs/{job_id}/verified-question:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getVerifiedQuestion
      summary: Read a human-confirmed question fact
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Verified question.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedQuestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /households/{household_id}/tutor/hints:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    post:
      operationId: createTutorHint
      summary: Return a provider-free graduated hint for a verified question
      description: The client submits only a server-issued VerifiedQuestion ID. The API reloads the child-owned confirmed fact, persists an append-only TutorTurn, and returns a deterministic zero-cost local hint without a direct answer or Provider call.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTutorHintRequest'
      responses:
        '200':
          description: Persisted bounded offline TutorTurn; direct_answer is always null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorHintResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Capture has not been manually confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /households/{household_id}/children/{child_id}/mistakes:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: child_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listMistakes
      summary: List open mistakes for a child
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - name: due_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Open mistake records and their deterministic review schedules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MistakeWithSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createMistake
      summary: Record a manually confirmed mistake from a VerifiedQuestion
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMistakeRequest'
      responses:
        '201':
          description: Mistake and first due review schedule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MistakeWithSchedule'
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MistakeWithSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/children/{child_id}/mistakes/{mistake_id}/review:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: child_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: mistake_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: reviewMistake
      summary: Record a review result and advance the deterministic schedule
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewMistakeRequest'
      responses:
        '200':
          description: Updated mistake and review schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MistakeWithSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/reports/weekly:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: child_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: week_start
        in: query
        required: true
        schema:
          type: string
          format: date
    get:
      operationId: getWeeklyReport
      summary: Read a privacy-minimized, traceable weekly learning projection
      description: Counts only server-owned task/session/question/Tutor facts. Review items contain task and session identifiers but never question or answer text.
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Weekly report for the requested child.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /households/{household_id}/children/{child_id}/exports:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: child_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: exportChildData
      summary: Create a short-lived portable snapshot of one child's family data
      description: Parent-only. The 24-hour PostgreSQL snapshot excludes credentials, object keys and image bytes; an identical idempotency key returns the exact same payload and child deletion cascades it.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Portable child data snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildDataExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /households/{household_id}/captures/{capture_id}/ocr-results/{result_id}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: result_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOcrResult
      summary: Get unverified OCR candidates for the bound child
      description: The child-only response is rechecked against Household, Child, and Capture ownership. Candidates remain unverified and must be manually confirmed before entering the learning workflow.
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: OCR result and candidates awaiting manual confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrResultWithCandidates'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: confirmOcrCandidate
      summary: Confirm one OCR candidate as a manual Capture correction
      description: The server resolves the candidate by ID under the bound Household, Child, result, and Capture, then appends its text to CaptureCorrection. The OCR result remains an unverified model output.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmOcrCandidateRequest'
      responses:
        '201':
          description: Candidate text appended as a manual Capture correction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureCorrection'
        '200':
          description: Idempotent confirmation replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureCorrection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Capture version, state, or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    HouseholdId:
      name: household_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    BearerSession:
      type: http
      scheme: bearer
      bearerFormat: opaque 256-bit session token
      description: Flutter session token; only a SHA-256 digest is stored by the API.
    SessionCookie:
      type: apiKey
      in: cookie
      name: study_session
      description: HttpOnly SameSite=Lax Web session cookie.
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 80
        password:
          type: string
          minLength: 1
          maxLength: 128
        client:
          type: string
          enum: [web, flutter]
          default: web
    LoginResponse:
      type: object
      additionalProperties: false
      required: [account, expires_at]
      properties:
        account:
          $ref: '#/components/schemas/AccountView'
        access_token:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
    AccountView:
      type: object
      additionalProperties: false
      required: [id, household_id, username, role, must_change_password, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [parent, child]
        child_id:
          type: string
          format: uuid
          nullable: true
        must_change_password:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          minLength: 1
          maxLength: 128
    CreateChildAccountRequest:
      type: object
      additionalProperties: false
      required: [username, password, child_id]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 80
        password:
          type: string
          minLength: 1
          maxLength: 128
        child_id:
          type: string
          format: uuid
