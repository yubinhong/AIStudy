    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: uploadCapture
      summary: Upload one Capture through the authenticated API
      description: The API authorizes the Session before consuming a bounded image stream, validates the declared size/hash and decoded image, then stores the object in private MinIO. Clients never receive an object-storage URL.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: X-Capture-Media-Type
          in: header
          required: true
          schema:
            type: string
            enum: [image/jpeg, image/png]
        - name: X-Capture-Byte-Size
          in: header
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 8000000
        - name: X-Capture-Content-SHA256
          in: header
          required: true
          schema:
            type: string
            minLength: 64
            maxLength: 64
            pattern: '^[a-f0-9]{64}$'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Capture bytes were stored and the Capture advanced to needs_correction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capture'
        '200':
          description: Idempotent upload replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capture'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          description: The bounded image stream failed media, size, hash, or decoded-image validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
