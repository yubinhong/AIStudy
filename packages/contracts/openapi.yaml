        media_type:
          type: string
          enum: [image/jpeg, image/png]
        byte_size:
          type: integer
          minimum: 1
          maximum: 8000000
        content_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
    Capture:
      type: object
      additionalProperties: false
      required: [id, household_id, child_id, session_id, media_type, byte_size, content_sha256, status, version, created_at]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        media_type:
          type: string
          enum: [image/jpeg, image/png]
        byte_size:
          type: integer
        content_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        status:
          type: string
          enum: [upload_pending, needs_correction, corrected]
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    PrivacySanitization:
      type: object
      additionalProperties: false
      required: [schema_version, sanitizer_version, safe_to_upload, requires_confirmation, sensitive_types, region_count, face_detected, qr_detected, barcode_detected, blocked_reasons, sanitized_derivative_sha256]
      properties:
        schema_version:
          type: string
          const: privacy-sanitization.v1
        sanitizer_version:
          type: string
          minLength: 1
          maxLength: 64
        safe_to_upload:
          type: boolean
        requires_confirmation:
          type: boolean
          const: true
        sensitive_types:
          type: array
          uniqueItems: true
          maxItems: 32
          items:
            type: string
            enum: [name, school, class, grade, student_id, exam_id, seat_number, phone, address, signature, face, qr_code, barcode]
        region_count:
          type: integer
          minimum: 0
          maximum: 256
        face_detected:
          type: boolean
        qr_detected:
          type: boolean
        barcode_detected:
          type: boolean
        blocked_reasons:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 64
        sanitized_derivative_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
    StartImageAnalysisRequest:
      type: object
      additionalProperties: false
      required: [expected_capture_version, sanitization, user_confirmed]
      properties:
        expected_capture_version:
          type: integer
          minimum: 1
        sanitization:
          $ref: '#/components/schemas/PrivacySanitization'
        user_confirmed:
          type: boolean
          const: true
    ImageAnalysisJobReceipt:
      type: object
      additionalProperties: false
      required: [id, capture_id, household_id, child_id, status, attempt, sanitization_schema_version, sanitized_derivative_sha256, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        capture_id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, succeeded, failed, blocked]
        attempt:
          type: integer
          minimum: 0
        sanitization_schema_version:
          type: string
          const: privacy-sanitization.v1
        sanitized_derivative_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        extraction_id:
          type: string
          format: uuid
          nullable: true
        error_code:
          type: string
          minLength: 1
          maxLength: 64
          nullable: true
    QuestionExtraction:
      type: object
      additionalProperties: false
      required: [schema_version, subject, question_text, options, formulas, has_diagram, has_handwriting, answer_state, answer_state_confidence, answer_steps, question_region_count, confidence, needs_confirmation]
      properties:
        schema_version: {type: string, const: question-extraction.v1}
        subject: {type: string, const: math}
        question_text: {type: string, minLength: 1, maxLength: 4000}
        options:
          type: array
          maxItems: 20
          items: {type: string}
        formulas:
          type: array
          maxItems: 50
          items: {type: string}
        has_diagram: {type: boolean}
        has_handwriting: {type: boolean}
        detected_answer: {type: [string, 'null'], maxLength: 1000}
        answer_state:
          type: string
          enum: [worked, blank, unclear, answer_area_missing]
        answer_state_confidence: {type: number, minimum: 0, maximum: 1}
        answer_steps:
          type: array
          maxItems: 30
          items: {type: string, minLength: 1, maxLength: 500}
        question_region_count: {type: integer, minimum: 0, maximum: 256}
        confidence: {type: number, minimum: 0, maximum: 1}
        needs_confirmation: {type: boolean, const: true}
    QuestionExtractionRecord:
      type: object
      additionalProperties: false
      required: [id, capture_id, household_id, child_id, extraction, created_at]
      properties:
        id:
          type: string
          format: uuid
        capture_id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
