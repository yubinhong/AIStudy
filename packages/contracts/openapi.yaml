  /households/{household_id}/children/{child_id}/english-practice/sessions/{session_id}/stream:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: child_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: session_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    x-websocket:
      summary: Bearer Session protected PCM16 relay
      security:
        - BearerSession: []
      input-audio: {encoding: pcm_s16le, sample-rate: 16000, channels: 1, frame-ms: [20, 40]}
      output-audio: {encoding: pcm_s16le, sample-rate: 24000, channels: 1, frame-ms: [20, 40]}
      client-control-schema: ./schemas/english-live-client-event.v1.json
      server-control-schema: ./schemas/english-live-server-event.v1.json
  /households/{household_id}/captures/{capture_id}/ocr-results/{result_id}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: result_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getOcrResult
      summary: Get unverified OCR candidates for the bound child
      description: The child-only response is rechecked against Household, Child, and Capture ownership. Candidates remain unverified and must be manually confirmed before entering the learning workflow.
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: OCR result and candidates awaiting manual confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrResultWithCandidates'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: confirmOcrCandidate
      summary: Confirm one OCR candidate as a manual Capture correction
      description: The server resolves the candidate by ID under the bound Household, Child, result, and Capture, then appends its text to CaptureCorrection. The OCR result remains an unverified model output.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmOcrCandidateRequest'
      responses:
        '201':
          description: Candidate text appended as a manual Capture correction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureCorrection'
        '200':
          description: Idempotent confirmation replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureCorrection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Capture version, state, or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    HouseholdId:
      name: household_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    BearerSession:
      type: http
      scheme: bearer
      bearerFormat: opaque 256-bit session token
      description: Flutter session token; only a SHA-256 digest is stored by the API.
    SessionCookie:
      type: apiKey
      in: cookie
      name: study_session
      description: HttpOnly SameSite=Lax Web session cookie.
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 80
        password:
          type: string
          minLength: 1
          maxLength: 128
        client:
          type: string
          enum: [web, flutter]
          default: web
    LoginResponse:
      type: object
      additionalProperties: false
      required: [account, expires_at]
      properties:
        account:
          $ref: '#/components/schemas/AccountView'
        access_token:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
    AccountView:
      type: object
      additionalProperties: false
      required: [id, household_id, username, role, must_change_password, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [super_admin, parent, child]
        child_id:
          type: string
          format: uuid
          nullable: true
        must_change_password:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
    FamilyParentView:
      type: object
      additionalProperties: false
      required: [account, child_count]
      properties:
        account: {$ref: '#/components/schemas/AccountView'}
        child_count: {type: integer, minimum: 0}
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          minLength: 1
          maxLength: 128
    CreateChildAccountRequest:
      type: object
      additionalProperties: false
      required: [username, password, child_id]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 80
        password:
          type: string
          minLength: 1
          maxLength: 128
        child_id:
          type: string
          format: uuid
    CreateParentAccountRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 80}
        password: {type: string, minLength: 1, maxLength: 128}
    CreateHouseholdRequest:
      type: object
      additionalProperties: false
      required: [parent_username, parent_password]
      properties:
        parent_username: {type: string, minLength: 3, maxLength: 80}
        parent_password: {type: string, minLength: 1, maxLength: 128}
    DeleteParentAccountRequest:
      type: object
      additionalProperties: false
      required: [current_password]
      properties:
        current_password: {type: string, minLength: 1, maxLength: 128}
    CreateChildManagementRequest:
      type: object
      additionalProperties: false
      required: [display_name, grade, curriculum_version, subjects, username, password]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        grade:
          type: integer
          minimum: 1
          maximum: 6
        curriculum_version:
          type: string
          minLength: 1
          maxLength: 80
        subjects:
          type: array
          minItems: 1
          items:
            type: string
            enum: [math, chinese]
        username:
          type: string
          minLength: 3
          maxLength: 80
        password:
          type: string
          minLength: 1
          maxLength: 128
    ChildManagementView:
      type: object
      additionalProperties: false
      required: [child, account]
      properties:
        child:
          $ref: '#/components/schemas/ChildProfile'
        account:
          allOf:
            - $ref: '#/components/schemas/AccountView'
          nullable: true
    SetAccountStatusRequest:
      type: object
      additionalProperties: false
      required: [enabled, current_password]
      properties:
        enabled:
          type: boolean
        current_password:
          type: string
          minLength: 1
          maxLength: 128
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          minLength: 1
          maxLength: 128
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: study-api
        version:
          type: string
          const: 0.17.0
    CreateChildRequest:
      type: object
      additionalProperties: false
      required: [display_name, grade, curriculum_version, subjects]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        grade:
          type: integer
          minimum: 1
          maximum: 6
        curriculum_version:
          type: string
          minLength: 1
          maxLength: 80
        subjects:
          type: array
          minItems: 1
          items:
            type: string
            enum: [math, chinese]
    UpdateChildRequest:
      allOf:
        - $ref: '#/components/schemas/CreateChildRequest'
    ChildProfile:
      type: object
      additionalProperties: false
      required: [id, household_id, owner_account_id, display_name, grade, curriculum_version, subjects, created_at]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        owner_account_id:
          type: string
          format: uuid
        display_name:
          type: string
        grade:
          type: integer
        curriculum_version:
          type: string
        subjects:
          type: array
          items:
            type: string
            enum: [math, chinese]
        created_at:
          type: string
          format: date-time
    CreateDeviceRequest:
      type: object
      additionalProperties: false
      required: [kind, platform, display_name]
      properties:
        kind:
          type: string
          enum: [child, parent]
        platform:
          type: string
          enum: [ios, android, web]
        display_name:
          type: string
          minLength: 1
          maxLength: 80
    Device:
      type: object
      additionalProperties: false
      required: [id, household_id, kind, platform, display_name, status, registered_at]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [child, parent]
        platform:
          type: string
          enum: [ios, android, web]
        display_name:
          type: string
        status:
          type: string
          const: active
        registered_at:
          type: string
          format: date-time
    TaskExercise:
      type: object
      additionalProperties: false
      required: [question_text, source_type, mistake_id, snapshot_id, curriculum_chunk_id, knowledge_point_id, knowledge_key, source_title, source_page, visual_description, requires_visual_context]
      properties:
        question_text:
          type: string
          minLength: 1
          maxLength: 4000
        source_type:
          type: string
          enum: [mistake, curriculum]
        mistake_id: {type: string, format: uuid, nullable: true}
        snapshot_id: {type: string, format: uuid, nullable: true}
        curriculum_chunk_id: {type: string, format: uuid, nullable: true}
        knowledge_point_id: {type: string, format: uuid, nullable: true}
        knowledge_key: {type: string, maxLength: 80, nullable: true}
        source_title: {type: string, maxLength: 160, nullable: true}
        source_page: {type: integer, minimum: 1, nullable: true}
        visual_description: {type: string, maxLength: 1000, nullable: true}
        requires_visual_context: {type: boolean}
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [child_id, title, subject, scheduled_for]
      properties:
        child_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        subject:
          type: string
          enum: [math, chinese]
        scheduled_for:
          type: string
          format: date
        source_type:
          type: string
          enum: [manual, mistake_review, curriculum_exercise, mixed_plan]
          default: manual
        reason: {type: string, maxLength: 500, nullable: true}
        knowledge_point: {type: string, maxLength: 120, nullable: true}
        knowledge_point_id: {type: string, format: uuid, nullable: true}
        exercises:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/TaskExercise'}
        estimated_minutes: {type: integer, minimum: 1, maximum: 120, nullable: true}
    StudyTask:
      type: object
      additionalProperties: false
      required: [id, household_id, child_id, title, subject, scheduled_for, status, version, created_at, source_type, reason, knowledge_point, knowledge_point_id, exercises, estimated_minutes]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
        title:
          type: string
        subject:
          type: string
          enum: [math, chinese]
        scheduled_for:
          type: string
          format: date
        status:
          type: string
          enum: [assigned, in_progress, completed, skipped, revoked]
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        source_type:
          type: string
          enum: [manual, mistake_review, curriculum_exercise, mixed_plan]
        reason: {type: string, maxLength: 500, nullable: true}
        knowledge_point: {type: string, maxLength: 120, nullable: true}
        knowledge_point_id: {type: string, format: uuid, nullable: true}
        exercises:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/TaskExercise'}
        estimated_minutes: {type: integer, minimum: 1, maximum: 120, nullable: true}
    StartStudySessionRequest:
      type: object
      additionalProperties: false
      required: [expected_task_version]
      properties:
        expected_task_version:
          type: integer
          minimum: 1
    CompleteStudySessionRequest:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [learned, needs_review, skipped]
    StudySession:
      type: object
      additionalProperties: false
      required: [id, household_id, child_id, task_id, task_version, next_exercise_index, status, started_at]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        task_version:
          type: integer
          minimum: 1
        next_exercise_index:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [active, completed, revoked]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        outcome:
          type: string
          enum: [learned, needs_review, skipped, revoked]
          nullable: true
    EnglishScenario:
      type: object
      additionalProperties: false
      required: [id, title, description, target_minutes]
      properties:
        id:
          type: string
          enum: [greetings, school, food_order]
        title: {type: string}
        description: {type: string}
        target_minutes: {type: integer, minimum: 5, maximum: 8}
    EnglishPracticeSettings:
      type: object
      additionalProperties: false
      required:
        - household_id
        - child_id
        - enabled
        - level
        - version
        - provider_available
        - required_consent_version
        - daily_limit_minutes
      properties:
        household_id: {type: string, format: uuid}
        child_id: {type: string, format: uuid}
        enabled: {type: boolean}
        level: {type: string, enum: [pre_a1, a1, a2]}
        consent_version: {type: [string, 'null'], maxLength: 64}
        version: {type: integer, minimum: 0}
        updated_by: {type: [string, 'null'], format: uuid}
        updated_at: {type: [string, 'null'], format: date-time}
        provider_available: {type: boolean}
        required_consent_version: {type: string, maxLength: 64}
        daily_limit_minutes: {type: integer, const: 10}
    EnglishPracticeSettingsRecord:
      type: object
      additionalProperties: false
      required: [household_id, child_id, enabled, level, version]
      properties:
        household_id: {type: string, format: uuid}
        child_id: {type: string, format: uuid}
        enabled: {type: boolean}
        level: {type: string, enum: [pre_a1, a1, a2]}
        consent_version: {type: [string, 'null'], maxLength: 64}
        version: {type: integer, minimum: 0}
        updated_by: {type: [string, 'null'], format: uuid}
        updated_at: {type: [string, 'null'], format: date-time}
    UpdateEnglishPracticeSettings:
      type: object
      additionalProperties: false
      required: [enabled, level, expected_version]
      properties:
        enabled: {type: boolean}
        level: {type: string, enum: [pre_a1, a1, a2]}
        consent_version: {type: [string, 'null'], maxLength: 64}
        expected_version: {type: integer, minimum: 0}
    StartEnglishPracticeSessionRequest:
      type: object
      additionalProperties: false
      required: [scenario_id]
      properties:
        scenario_id: {type: string, enum: [greetings, school, food_order]}
    CompleteEnglishPracticeSessionRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [completed, interrupted]}
    EnglishPracticeSession:
      type: object
      additionalProperties: false
      required:
        - id
        - household_id
        - child_id
        - scenario_id
        - level
        - status
        - provider
        - model_version
        - policy_version
        - started_at
        - duration_seconds
        - turn_count
        - input_audio_ms
        - output_audio_ms
        - cost_micros
        - feedback_tags
      properties:
        id: {type: string, format: uuid}
        household_id: {type: string, format: uuid}
        child_id: {type: string, format: uuid}
        scenario_id: {type: string, enum: [greetings, school, food_order]}
        level: {type: string, enum: [pre_a1, a1, a2]}
        status: {type: string, enum: [active, completed, interrupted, failed]}
        provider: {type: string, maxLength: 32}
        model_version: {type: string, maxLength: 64}
        policy_version: {type: string, maxLength: 64}
        started_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        duration_seconds: {type: integer, minimum: 0, maximum: 480}
        turn_count: {type: integer, minimum: 0}
        input_audio_ms: {type: integer, minimum: 0}
        output_audio_ms: {type: integer, minimum: 0}
        cost_micros: {type: integer, minimum: 0}
        feedback_tags:
          type: array
          maxItems: 3
          items: {type: string, maxLength: 64}
        failure_code: {type: [string, 'null'], maxLength: 64}
    CreateCaptureRequest:
