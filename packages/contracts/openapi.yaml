openapi: 3.1.0
info:
  title: 家庭 AI 学习助手 API
  version: 0.5.0
  description: Synthetic local/CI household and learning contract vertical slices.
servers:
  - url: http://localhost:8000
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Service health check
      responses:
        '200':
          description: Service is ready to receive requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /households/{household_id}/children:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listChildren
      summary: List children in the caller's household
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
      responses:
        '200':
          description: Children visible to the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChildProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createChild
      summary: Create a child profile in the caller's household
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildRequest'
      responses:
        '201':
          description: Child profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
        '200':
          description: Idempotent replay of an earlier create request.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/children/{child_id}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: child_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getChild
      summary: Get a child profile in the caller's household
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
      responses:
        '200':
          description: Child profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteChild
      summary: Delete a child profile after cascading Capture object deletion
      description: Local/CI synthetic deletion only. The profile is not removed when any Capture object deletion fails; the same idempotency key may be retried.
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Child profile and all claimed Capture objects were deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          description: Deletion is incomplete or temporarily unavailable; retry is safe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /households/{household_id}/devices:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listDevices
      summary: List devices in the caller's household
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
      responses:
        '200':
          description: Devices visible to the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: registerDevice
      summary: Register a device in the caller's household
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
      responses:
        '201':
          description: Device registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '200':
          description: Idempotent replay of an earlier registration.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/tasks:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listTasks
      summary: List tasks visible to the caller
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
          DemoChild: []
      responses:
        '200':
          description: Tasks visible to the parent or bound child.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudyTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createTask
      summary: Create a math task for a child in the caller's household
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyTask'
        '200':
          description: Idempotent task-create replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/tasks/{task_id}/sessions:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/TaskId'
    post:
      operationId: startStudySession
      summary: Start a session for a task assigned to the bound child
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
          DemoChild: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartStudySessionRequest'
      responses:
        '201':
          description: Study session started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '200':
          description: Idempotent start-session replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/sessions/{session_id}/attempts:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: recordAttempt
      summary: Append an attempt to the bound child's active study session
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
          DemoChild: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordAttemptRequest'
      responses:
        '201':
          description: Attempt appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '200':
          description: Idempotent attempt replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/sync-batches:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    post:
      operationId: syncOfflineBatch
      summary: Apply a versioned batch of offline attempt events atomically
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
          DemoChild: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatchRequest'
      responses:
        '200':
          description: Batch applied or replayed without partial writes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBatchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/sessions/{session_id}/captures:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: listCaptures
      summary: List Capture metadata visible to the bound child in a study session
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
          DemoChild: []
      responses:
        '200':
          description: Capture metadata. This endpoint never returns media bytes or object URLs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Capture'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createCapture
      summary: Register bounded image metadata and require manual correction
      description: No image bytes, signed URLs, object keys, or OCR Provider calls are accepted in this contract version.
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
          DemoChild: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaptureRequest'
      responses:
        '201':
          description: Capture metadata registered with needs_correction status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capture'
        '200':
          description: Idempotent Capture-create replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capture'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/captures/{capture_id}/corrections:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: correctCapture
      summary: Append a manual correction for a Capture owned by the bound child
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
          DemoChild: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectCaptureRequest'
      responses:
        '201':
          description: Manual correction appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureCorrection'
        '200':
          description: Idempotent correction replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureCorrection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Capture version or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /households/{household_id}/captures/{capture_id}/save:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: saveCapture
      summary: Save a Capture image beyond its default retention window
      description: Parent-only local/CI operation. Saving does not expose media bytes, object keys, or storage credentials.
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Capture image is marked parent-saved.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/captures/{capture_id}/media:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteCaptureMedia
      summary: Immediately delete one Capture image
      description: Parent-only local/CI operation. Deletion is private-object scoped, retryable, and does not delete Capture metadata.
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Capture image deletion completed or was replayed.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '503':
          description: Object storage deletion is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /households/{household_id}/sessions/{session_id}/capture-uploads:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: beginCaptureUpload
      summary: Create a pending Capture and issue one short-lived private PUT URL
      description: The response has no separate object-key field. The signed URL is short-lived and must not be logged or persisted by clients.
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
          DemoChild: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaptureRequest'
      responses:
        '201':
          description: Pending Capture created and a short-lived upload URL issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureUpload'
        '200':
          description: Idempotent replay while the Capture upload remains pending. A replacement short-lived URL may be issued.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '503':
          description: Private object storage is temporarily unavailable; retry with the same idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /households/{household_id}/captures/{capture_id}/upload-confirmations:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: confirmCaptureUpload
      summary: Confirm a server-verified private object before manual correction
      description: The API verifies object media type and byte size server-side. It never accepts an object key or bytes from the client.
      security:
        - DemoHouseholdPrincipal: []
          DemoRole: []
          DemoChild: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmCaptureUploadRequest'
      responses:
        '201':
          description: Private object verified; Capture advances to needs_correction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capture'
        '200':
          description: Idempotent upload-confirmation replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capture'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Object verification, Capture state/version, or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    HouseholdId:
      name: household_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    DemoHouseholdPrincipal:
      type: apiKey
      in: header
      name: X-Demo-Household-Id
      description: Synthetic local/CI principal adapter; not production authentication.
    DemoRole:
      type: apiKey
      in: header
      name: X-Demo-Role
      description: Synthetic local/CI role adapter; not production authorization.
    DemoChild:
      type: apiKey
      in: header
      name: X-Demo-Child-Id
      description: Synthetic child binding for local/CI child-only learning operations; not production authentication.
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: study-api
        version:
          type: string
          const: 0.4.0
    CreateChildRequest:
      type: object
      additionalProperties: false
      required: [display_name, grade, curriculum_version, subjects]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        grade:
          type: integer
          minimum: 1
          maximum: 6
        curriculum_version:
          type: string
          minLength: 1
          maxLength: 80
        subjects:
          type: array
          minItems: 1
          items:
            type: string
            enum: [math]
    ChildProfile:
      type: object
      additionalProperties: false
      required: [id, household_id, display_name, grade, curriculum_version, subjects, created_at]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        display_name:
          type: string
        grade:
          type: integer
        curriculum_version:
          type: string
        subjects:
          type: array
          items:
            type: string
            enum: [math]
        created_at:
          type: string
          format: date-time
    CreateDeviceRequest:
      type: object
      additionalProperties: false
      required: [kind, platform, display_name]
      properties:
        kind:
          type: string
          enum: [child, parent]
        platform:
          type: string
          enum: [ios, android, web]
        display_name:
          type: string
          minLength: 1
          maxLength: 80
    Device:
      type: object
      additionalProperties: false
      required: [id, household_id, kind, platform, display_name, status, registered_at]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [child, parent]
        platform:
          type: string
          enum: [ios, android, web]
        display_name:
          type: string
        status:
          type: string
          const: active
        registered_at:
          type: string
          format: date-time
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [child_id, title, subject, scheduled_for]
      properties:
        child_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        subject:
          type: string
          enum: [math]
        scheduled_for:
          type: string
          format: date
    StudyTask:
      type: object
      additionalProperties: false
      required: [id, household_id, child_id, title, subject, scheduled_for, status, version, created_at]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
        title:
          type: string
        subject:
          type: string
          enum: [math]
        scheduled_for:
          type: string
          format: date
        status:
          type: string
          enum: [assigned, in_progress]
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    StartStudySessionRequest:
      type: object
      additionalProperties: false
      required: [expected_task_version]
      properties:
        expected_task_version:
          type: integer
          minimum: 1
    StudySession:
      type: object
      additionalProperties: false
      required: [id, household_id, child_id, task_id, task_version, status, started_at]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        task_version:
          type: integer
          minimum: 1
        status:
          type: string
          const: active
        started_at:
          type: string
          format: date-time
    CreateCaptureRequest:
      type: object
      additionalProperties: false
      required: [media_type, byte_size, content_sha256]
      properties:
        media_type:
          type: string
          enum: [image/jpeg, image/png]
        byte_size:
          type: integer
          minimum: 1
          maximum: 8000000
        content_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
    Capture:
      type: object
      additionalProperties: false
      required: [id, household_id, child_id, session_id, media_type, byte_size, content_sha256, status, version, created_at]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        media_type:
          type: string
          enum: [image/jpeg, image/png]
        byte_size:
          type: integer
        content_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        status:
          type: string
          enum: [upload_pending, needs_correction, corrected]
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    CaptureUpload:
      type: object
      additionalProperties: false
      required: [capture, upload_url, upload_expires_at]
      properties:
        capture:
          $ref: '#/components/schemas/Capture'
        upload_url:
          type: string
          format: uri
          description: Short-lived PUT URL; clients must not persist or log it.
        upload_expires_at:
          type: string
          format: date-time
    ConfirmCaptureUploadRequest:
      type: object
      additionalProperties: false
      required: [expected_capture_version]
      properties:
        expected_capture_version:
          type: integer
          minimum: 1
    CorrectCaptureRequest:
      type: object
      additionalProperties: false
      required: [expected_capture_version, corrected_text]
      properties:
        expected_capture_version:
          type: integer
          minimum: 1
        corrected_text:
          type: string
          minLength: 1
          maxLength: 1000
    CaptureCorrection:
      type: object
      additionalProperties: false
      required: [id, capture_id, household_id, child_id, sequence, corrected_text, created_at]
      properties:
        id:
          type: string
          format: uuid
        capture_id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        corrected_text:
          type: string
        created_at:
          type: string
          format: date-time
    RecordAttemptRequest:
      type: object
      additionalProperties: false
      required: [event_id, answer_summary]
      properties:
        event_id:
          type: string
          format: uuid
        answer_summary:
          type: string
          minLength: 1
          maxLength: 200
    Attempt:
      type: object
      additionalProperties: false
      required: [id, event_id, household_id, child_id, session_id, sequence, answer_summary, recorded_at]
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        answer_summary:
          type: string
        recorded_at:
          type: string
          format: date-time
    SyncEvent:
      type: object
      additionalProperties: false
      required: [event_id, idempotency_key, kind, session_id, answer_summary]
      properties:
        event_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
        kind:
          type: string
          const: record_attempt
        session_id:
          type: string
          format: uuid
        answer_summary:
          type: string
          minLength: 1
          maxLength: 200
    SyncBatchRequest:
      type: object
      additionalProperties: false
      required: [schema_version, events]
      properties:
        schema_version:
          type: integer
          const: 1
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/SyncEvent'
    SyncEventResult:
      type: object
      additionalProperties: false
      required: [event_id, status, attempt]
      properties:
        event_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [applied, replayed]
        attempt:
          $ref: '#/components/schemas/Attempt'
    SyncBatchResult:
      type: object
      additionalProperties: false
      required: [schema_version, results]
      properties:
        schema_version:
          type: integer
          const: 1
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncEventResult'
  responses:
    Unauthorized:
      description: Missing or invalid synthetic principal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Principal role cannot perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource is not visible in the caller's household.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: Idempotency key was reused with a different payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidRequest:
      description: Request failed schema validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
