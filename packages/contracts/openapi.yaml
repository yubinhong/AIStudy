        session_id: {type: string, format: uuid}
        outcome: {type: string, enum: [learned, needs_review, skipped]}
        mistake: {$ref: '#/components/schemas/MistakeWithSchedule'}
        schedule: {$ref: '#/components/schemas/ReviewSchedule'}
    MistakeRecord:
      type: object
      additionalProperties: false
      required: [id, household_id, child_id, verified_question_id, session_id, reason, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
        verified_question_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        reason:
          type: string
        status:
          type: string
          enum: [open, resolved]
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, 'null']
          format: date-time
    ReviewSchedule:
      type: object
      additionalProperties: false
      required: [id, household_id, child_id, mistake_id, due_at, interval_days, repetitions, last_outcome, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
        mistake_id:
          type: string
          format: uuid
        due_at:
          type: string
          format: date-time
        interval_days:
          type: integer
          minimum: 1
        repetitions:
          type: integer
          minimum: 0
        last_outcome:
          type: [string, 'null']
          enum: [correct, needs_review, skipped, null]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MistakeWithSchedule:
      type: object
      additionalProperties: false
      required: [mistake, schedule]
      properties:
        mistake:
          $ref: '#/components/schemas/MistakeRecord'
        schedule:
          $ref: '#/components/schemas/ReviewSchedule'
        question:
          allOf:
            - $ref: '#/components/schemas/ReviewQuestion'
          nullable: true
    ReviewQuestion:
      type: object
      additionalProperties: false
      required: [id, question_text, options, formulas]
      properties:
        id: {type: string, format: uuid}
        question_text: {type: string}
        options: {type: array, items: {type: string}}
        formulas: {type: array, items: {type: string}}
    ReviewItem:
      type: object
      additionalProperties: false
      required: [session_id, task_id, task_title, reason]
      properties:
        session_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        task_title:
          type: string
        reason:
          type: string
          const: child_requested_review
    WeeklyReport:
      type: object
      additionalProperties: false
      required: [child_id, week_start, week_end, tasks_assigned, tasks_completed, tasks_skipped, sessions_completed, needs_review, verified_questions, tutor_turns, completion_rate, review_items]
      properties:
        child_id:
          type: string
          format: uuid
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        tasks_assigned:
          type: integer
          minimum: 0
        tasks_completed:
          type: integer
          minimum: 0
        tasks_skipped:
          type: integer
          minimum: 0
        sessions_completed:
          type: integer
          minimum: 0
        needs_review:
          type: integer
          minimum: 0
        verified_questions:
          type: integer
          minimum: 0
        tutor_turns:
          type: integer
          minimum: 0
        completion_rate:
          type: number
          minimum: 0
          maximum: 1
        review_items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewItem'
    LearningDetail:
      type: object
      additionalProperties: false
      required: [question, tutor_turns]
      properties:
        question: {$ref: '#/components/schemas/VerifiedQuestion'}
        tutor_turns:
          type: array
          items: {$ref: '#/components/schemas/TutorHintResponse'}
    ChildDataExport:
      type: object
      additionalProperties: false
      required: [schema_version, generated_at, child, tasks, sessions, attempts, verified_questions, tutor_turns, mistakes, review_schedules, english_practice_sessions]
      properties:
        schema_version:
          type: string
          const: child-data-export.v1
        generated_at:
          type: string
          format: date-time
        child:
          $ref: '#/components/schemas/ChildProfile'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/StudyTask'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/StudySession'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/Attempt'
        verified_questions:
          type: array
          items:
            $ref: '#/components/schemas/VerifiedQuestion'
        tutor_turns:
          type: array
          items:
            $ref: '#/components/schemas/TutorHintResponse'
        mistakes:
          type: array
          items:
            $ref: '#/components/schemas/MistakeRecord'
        review_schedules:
          type: array
          items:
            $ref: '#/components/schemas/ReviewSchedule'
        english_practice_settings:
          oneOf:
            - $ref: '#/components/schemas/EnglishPracticeSettingsRecord'
            - type: 'null'
        english_practice_sessions:
          type: array
          items:
            $ref: '#/components/schemas/EnglishPracticeSession'
        chinese_attempts:
          type: array
          items:
            $ref: '#/components/schemas/ChineseAttemptExport'
        chinese_review_items:
          type: array
          items:
            $ref: '#/components/schemas/ChineseReviewItem'
    OcrJobReceipt:
      type: object
      additionalProperties: false
      required: [id, capture_id, mode, status, attempt, enqueued_at]
      properties:
        id:
          type: string
          format: uuid
        capture_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [text, formula]
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        attempt:
          type: integer
          minimum: 0
        enqueued_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        result_id:
          type: string
          format: uuid
          nullable: true
    EnqueueOcrJobRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        mode:
          type: string
          enum: [text, formula]
          default: text
    OcrResult:
      type: object
      additionalProperties: false
      required: [id, capture_id, household_id, child_id, provider, model, model_version, schema_version, confidence, status, requires_manual_confirmation, created_at]
      properties:
        id:
          type: string
          format: uuid
        capture_id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
        provider:
          type: string
          minLength: 1
          maxLength: 80
        model:
          type: string
          minLength: 1
          maxLength: 120
        model_version:
          type: string
          minLength: 1
          maxLength: 80
        schema_version:
          type: string
          minLength: 1
          maxLength: 32
        confidence:
          type: number
          minimum: 0
          maximum: 1
        status:
          type: string
          enum: [candidate, empty]
        requires_manual_confirmation:
          type: boolean
          const: true
        created_at:
          type: string
          format: date-time
    OcrCandidate:
      type: object
      additionalProperties: false
      required: [id, result_id, sequence, text, confidence]
      properties:
        id:
          type: string
          format: uuid
        result_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        text:
          type: string
          minLength: 1
          maxLength: 1000
        confidence:
          type: number
          minimum: 0
          maximum: 1
    OcrResultWithCandidates:
      type: object
      additionalProperties: false
      required: [result, candidates]
      properties:
        result:
          $ref: '#/components/schemas/OcrResult'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/OcrCandidate'
    CorrectCaptureRequest:
      type: object
      additionalProperties: false
      required: [expected_capture_version, corrected_text]
      properties:
        expected_capture_version:
          type: integer
          minimum: 1
        corrected_text:
          type: string
          minLength: 1
          maxLength: 1000
    ConfirmOcrCandidateRequest:
      type: object
      additionalProperties: false
      required: [expected_capture_version, candidate_id]
      properties:
        expected_capture_version:
          type: integer
          minimum: 1
        candidate_id:
          type: string
          format: uuid
    CaptureCorrection:
      type: object
      additionalProperties: false
      required: [id, capture_id, household_id, child_id, sequence, corrected_text, created_at]
      properties:
        id:
          type: string
          format: uuid
        capture_id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        corrected_text:
          type: string
        created_at:
          type: string
          format: date-time
    RecordAttemptRequest:
      type: object
      additionalProperties: false
      required: [event_id, answer_summary]
      properties:
        event_id:
          type: string
          format: uuid
        answer_summary:
          type: string
          minLength: 1
          maxLength: 200
        answer_state:
          type: string
          enum: [worked, blank, unclear, answer_area_missing]
          default: unclear
        evidence_confirmed:
          type: boolean
          default: false
        next_exercise_index:
          type: integer
          minimum: 0
    Attempt:
      type: object
      additionalProperties: false
      required: [id, event_id, household_id, child_id, session_id, sequence, answer_summary, answer_state, evidence_confirmed, recorded_at]
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        answer_summary:
          type: string
        answer_state:
          type: string
          enum: [worked, blank, unclear, answer_area_missing]
        evidence_confirmed:
          type: boolean
        recorded_at:
          type: string
          format: date-time
    SyncEvent:
      type: object
      additionalProperties: false
      required: [event_id, idempotency_key, kind, session_id, answer_summary]
      properties:
        event_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
        kind:
          type: string
          const: record_attempt
        session_id:
          type: string
          format: uuid
        answer_summary:
          type: string
          minLength: 1
          maxLength: 200
        answer_state:
          type: string
          enum: [worked, blank, unclear, answer_area_missing]
          default: unclear
        evidence_confirmed:
          type: boolean
          default: false
        next_exercise_index:
          type: integer
          minimum: 0
    SyncBatchRequest:
      type: object
      additionalProperties: false
      required: [schema_version, events]
      properties:
        schema_version:
          type: integer
          const: 1
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/SyncEvent'
    SyncEventResult:
      type: object
      additionalProperties: false
      required: [event_id, status, attempt]
      properties:
        event_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [applied, replayed]
        attempt:
          $ref: '#/components/schemas/Attempt'
    SyncBatchResult:
      type: object
      additionalProperties: false
      required: [schema_version, results]
      properties:
        schema_version:
          type: integer
          const: 1
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncEventResult'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    Unauthorized:
      description: Missing or invalid synthetic principal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Principal role cannot perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource is not visible in the caller's household.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: Idempotency key was reused with a different payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidRequest:
      description: Request failed schema validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
