openapi: 3.1.0
info:
  title: 家庭 AI 学习助手 API
  version: 0.17.0
  description: Self-hosted Household account/session, multi-subject learning, Chinese practice, and gated English speaking contracts.
servers:
  - url: http://localhost:8000
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Service health check
      responses:
        '200':
          description: Service is ready to receive requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/login:
    post:
      operationId: login
      summary: Create a revocable account session
      description: The Web client receives an HttpOnly study_session cookie. Flutter requests client=flutter and stores the returned opaque token in platform secure storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      operationId: getCurrentAccount
      summary: Read the current account
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Current account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/change-password:
    post:
      operationId: changePassword
      summary: Change the current password and rotate all sessions
      security:
        - SessionCookie: []
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed and a new session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/households/{household_id}/accounts:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listAccounts
      summary: List accounts in one household
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Accounts without password hashes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/households/{household_id}/accounts/children:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    post:
      operationId: createChildAccount
      summary: Create a child account bound to one ChildProfile
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildAccountRequest'
      responses:
        '201':
          description: Child account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /auth/households/{household_id}/accounts/parents:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    post:
      operationId: createParentAccount
      summary: Create a non-administrative parent account
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateParentAccountRequest'}
      responses:
        '201':
          description: Parent account created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
  /auth/households:
    post:
      operationId: provisionHousehold
      summary: Provision an isolated household and its first parent
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateHouseholdRequest'}
      responses:
        '201':
          description: New household parent account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
  /auth/family-parents:
    get:
      operationId: listFamilyParents
      summary: List provisioned family parents for the instance super administrator
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Ordinary parent accounts with their owned child count.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/FamilyParentView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /auth/family-parents/{account_id}:
    parameters:
      - name: account_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: deleteFamilyParent
      summary: Delete an ordinary parent account with no owned children
      security:
        - SessionCookie: []
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeleteParentAccountRequest'}
      responses:
        '204': {description: Parent account and its sessions were deleted.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
  /auth/households/{household_id}/accounts/{account_id}/status:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: setAccountStatus
      summary: Enable or disable a child account
      security:
        - SessionCookie: []
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAccountStatusRequest'
      responses:
        '200':
          description: Updated child account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/households/{household_id}/accounts/{account_id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resetAccountPassword
      summary: Reset a child account password and revoke its sessions
      security:
        - SessionCookie: []
        - BearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset; no password is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /households/{household_id}/children:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listChildren
      summary: List children in the caller's household
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Children visible to the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChildProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createChild
      summary: Create a child profile in the caller's household
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildRequest'
      responses:
        '201':
          description: Child profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
        '200':
          description: Idempotent replay of an earlier create request.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/children/management:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listChildManagement
      summary: List child profiles with their bound child accounts
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Child management aggregates visible to a parent.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChildManagementView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createChildManagement
      summary: Atomically create a child profile and its unique child account
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildManagementRequest'
      responses:
        '201':
          description: Child profile and account created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildManagementView'
        '200':
          description: Idempotent replay of an earlier aggregate create request.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildManagementView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /households/{household_id}/children/{child_id}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: child_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getChild
      summary: Get a child profile in the caller's household
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Child profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateChild
      summary: Update a child profile in the caller's household
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChildRequest'
      responses:
        '200':
          description: Updated child profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
    delete:
      operationId: deleteChild
      summary: Delete a child profile after cascading Capture object deletion
      description: Local/CI synthetic deletion only. The profile is not removed when any Capture object deletion fails; the same idempotency key may be retried.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Child profile and all claimed Capture objects were deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          description: Deletion is incomplete or temporarily unavailable; retry is safe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /households/{household_id}/devices:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listDevices
      summary: List devices in the caller's household
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Devices visible to the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: registerDevice
      summary: Register a device in the caller's household
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
      responses:
        '201':
          description: Device registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '200':
          description: Idempotent replay of an earlier registration.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/tasks:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listTasks
      summary: List tasks visible to the caller
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - name: child_id
          in: query
          required: false
          description: Optional parent-side child scope for the workbench.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tasks visible to the parent or bound child.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudyTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createTask
      summary: Create a math task for a child in the caller's household
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyTask'
        '200':
          description: Idempotent task-create replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/tasks/{task_id}/sessions:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/TaskId'
    post:
      operationId: startStudySession
      summary: Start a session for a task assigned to the bound child
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartStudySessionRequest'
      responses:
        '201':
          description: Study session started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '200':
          description: Idempotent start-session replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/tasks/{task_id}/active-session:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/TaskId'
    get:
      operationId: getActiveStudySession
      summary: Resume the bound child's latest active session for a task
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        '200':
          description: Latest active child-owned session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /households/{household_id}/tasks/{task_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/TaskId'
    post:
      operationId: revokeStudyTask
      summary: Revoke a parent-assigned task
      description: Parent-only, idempotent task revocation. Any active child session is closed with a revoked outcome, and no further attempts or completion are accepted.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Revoked task or idempotently replayed revocation.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/capture-sessions:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    post:
      operationId: createCaptureSession
      summary: Create or replay an ad-hoc photo-question session for the bound child
      description: Atomically creates a private math task and active StudySession for photo capture. The child ID is always taken from the authenticated account and cannot be supplied by the client.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Capture session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '200':
          description: Idempotent replay of an existing capture session.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/sessions/{session_id}/attempts:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: recordAttempt
      summary: Append an attempt to the bound child's active study session
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordAttemptRequest'
      responses:
        '201':
          description: Attempt appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '200':
          description: Idempotent attempt replay.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/sessions/{session_id}/completion:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: completeStudySession
      summary: Finalize the bound child's study session with an explicit outcome
      description: Completion is idempotent and final. A learned or needs_review outcome completes the task; skipped marks it skipped. The server never infers mastery from model output.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteStudySessionRequest'
      responses:
        '200':
          description: Final or idempotently replayed StudySession.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /households/{household_id}/sync-batches:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    post:
      operationId: syncOfflineBatch
      summary: Apply a versioned batch of offline attempt events atomically
      security:
        - SessionCookie: []
        - BearerSession: []
