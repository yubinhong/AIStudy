        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: importCurriculum
      summary: Import an authorized curriculum manifest as a reviewable draft
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportCurriculumRequest'}
      responses:
        '201':
          description: Draft material and snapshot.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurriculumImportResult'}
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurriculumImportResult'}
  /households/{household_id}/children/{child_id}/curriculum/imports/files:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: child_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: importCurriculumFiles
      summary: Upload multiple authorized PDF curriculum documents as reviewable drafts
      description: Only PDF files are accepted. Each file is bounded to 50 MiB (52,428,800 bytes), stored privately, parsed by the local bounded worker, and remains a draft until a parent reviews and publishes it.
      security:
        - SessionCookie: []
        - BearerSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [files, authorization_statement, grade]
              properties:
                files:
                  type: array
                  minItems: 1
                  items: {type: string, format: binary, description: PDF only}
                authorization_statement: {type: string, minLength: 1, maxLength: 500}
                is_public_reusable: {type: boolean, default: false}
                grade: {type: integer, minimum: 1, maximum: 6}
                subject: {type: string, enum: [math, chinese], default: math}
                textbook_version: {type: string, minLength: 1, maxLength: 120, description: Optional parent override. Omit to infer a title locally from the PDF cover/front matter after upload.}
                term: {type: string, minLength: 1, maxLength: 40, description: Optional parent override. Omit to infer the volume from the PDF cover/front matter after upload.}
      responses:
        '201':
          description: One reviewable draft per uploaded document.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CurriculumImportResult'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          description: File or batch exceeds the bounded upload size.
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          description: Private object storage is temporarily unavailable.
  /households/{household_id}/children/{child_id}/curriculum:
    parameters:
